name: Tuta helper smoke check

# The Tuta helper is tuta-helper from tuta-unofficial-sdk, the
# native/tuta-unofficial-sdk submodule. That repository runs its own tests,
# lints and audits (github.com/tuna-os/tuta-unofficial-sdk), so this only
# checks what the fork relies on: the submodule sits on a release tag, its
# SDK prepares, the helper builds from its lock file, and run as hylki-tuta
# (the name the app looks for) it answers with a protocol error envelope.

on:
  push:
    paths:
      - 'native/tuta-unofficial-sdk'
      - '.gitmodules'
      - '.github/workflows/tuta-helper.yml'
  pull_request:
    paths:
      - 'native/tuta-unofficial-sdk'
      - '.gitmodules'
      - '.github/workflows/tuta-helper.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: tuta-helper as hylki-tuta
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4.4.0
        with:
          submodules: recursive
          persist-credentials: false

      - name: The submodule is on a release tag
        working-directory: native/tuta-unofficial-sdk
        run: |
          git fetch --tags --quiet origin
          git describe --exact-match --tags HEAD

      - name: Prepare the Tuta SDK
        run: sh native/tuta-unofficial-sdk/prepare.sh

      - name: Build the helper
        working-directory: native/tuta-unofficial-sdk
        run: cargo build --locked --release --bin tuta-helper

      - name: It answers as hylki-tuta
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          ln -s "$PWD/native/tuta-unofficial-sdk/target/release/tuta-helper" "$RUNNER_TEMP/bin/hylki-tuta"
          reply="$(printf '{"version":1,"op":"star"}' | "$RUNNER_TEMP/bin/hylki-tuta")"
          echo "$reply"
          test "$reply" = '{"error":{"code":"invalid_request"},"version":1}'
