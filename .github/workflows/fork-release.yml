name: Fork release
run-name: Fork release ${{ inputs.ref || github.ref_name }}

# Builds the fork's own app (Lifafa, the TunaOS office suite's email client,
# at the time of writing) as a Flatpak bundle for x86_64 and aarch64 and
# attaches both to the tag's GitHub release. Its name and app ID come from the
# identity block at the top of fork/rebrand.sh, which rebrands the checkout
# first and writes fork/<APP_ID>.yml: that builds the rebranded tree with the
# same recipe as upstream's manifest, the runtime, poppler, the dictionaries,
# and the Tuta (Rust) and Proton (Go) helpers. See fork/README.md.
#
# A release also goes into the app's signed OSTree repository, which `flatpak
# update` follows: the x86_64 job commits both arches' builds on top of the
# published ones with the key in the LIFAFA_GPG_PRIVATE_KEY secret, and pushes
# the repository, its .flatpakrepo and .flatpakref to the gh-pages branch,
# served by GitHub Pages (fork/flatpak-repo.sh). The bundles attached to the
# release are made from those signed commits and update from the repository.
# A manual run that is not a release assembles and signs the same repository
# as an artifact, without pushing it, so the publishing path is tested before
# a tag needs it.
#
# Manual runs that publish nothing build the app with LTO off and 16 codegen
# units (HYLKI_REBRAND_FAST_PROFILE in fork/rebrand.sh), unless asked for
# upstream's profile: a change to the app crate then recompiles in a fraction
# of the time. Tags, and the daily build that keeps their cache warm, use
# upstream's thin LTO with one codegen unit.
#
# What makes a run fast (fork/README.md, "Building"):
#   - Flathub's builder image already holds the GNOME runtime and SDK; the
#     Rust and Go SDK extensions are cached per arch and extension commit.
#   - flatpak-builder's state directory is cached per arch, SDK and Rust
#     extension commit: its module cache (poppler and the dictionaries are
#     reused while their sources are unchanged), its downloads, and under
#     ccache/ the cargo target directories the generated manifest builds in.
#     The modules built from the checkout (the app and both helpers) are
#     always rebuilt, since flatpak-builder cannot checksum a directory
#     source, but cargo then compiles only the crates that changed.
#   - A run can only read caches saved on its own ref or on main, so a tag's
#     own saves would help no other run: tag runs restore and never save, and
#     a daily build of main keeps main's caches current (and inside GitHub's
#     seven days of eviction) for the next tag.
#   - The x86_64 job attaches both bundles itself, so publishing does not wait
#     for another runner.

on:
  push:
    tags:
      - 'v*-tuna*'
  schedule:
    # After upstream-sync.yml (05:23), so the cache holds what it merged.
    - cron: '47 6 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag, branch or SHA to build; a v*-tuna* tag also publishes the release'
        required: false
        default: 'main'
      clean:
        description: 'Build from scratch, without restoring the build cache'
        type: boolean
        required: false
        default: false
      upstream_profile:
        description: "Build with upstream's release profile, as tags do, instead of the fast one"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

env:
  RUST_EXTENSION: org.freedesktop.Sdk.Extension.rust-stable//25.08
  GO_EXTENSION: org.freedesktop.Sdk.Extension.golang//25.08
  # The size above which the cargo target directories are dropped instead of
  # cached, so stale crates cannot pile up against GitHub's 10 GB per repo.
  CARGO_TARGET_CAP_MB: 5000

jobs:
  build:
    name: ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      # bubblewrap, for flatpak-builder's build sandbox.
      options: --privileged
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    permissions:
      # The x86_64 job publishes the release: it reads the run's artifacts
      # and jobs to wait for the aarch64 bundle, then pushes gh-pages and
      # writes the release.
      actions: read
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          # The Tuta helper's SDK (native/tuta-unofficial-sdk) and the
          # tutabridge and tutanota checkouts inside it, which
          # sdk-prepare.py reads.
          submodules: recursive
          # This job's token can write releases; nothing here pushes.
          persist-credentials: false

      - name: Trust the checkout
        # The container runs as root over a workspace the runner's user owns,
        # which git otherwise refuses as dubious ownership.
        run: git config --global --add safe.directory '*'

      - name: Pick the version
        id: version
        run: |
          # The app's ID and name, for this step and the ones below.
          APP_ID=$(fork/rebrand.sh --identity | sed -n 's/^APP_ID=//p')
          APP_NAME=$(fork/rebrand.sh --identity | sed -n 's/^APP_NAME=//p')
          test -n "$APP_ID" && test -n "$APP_NAME"
          {
            echo "APP_ID=$APP_ID"
            echo "APP_NAME=$APP_NAME"
          } >> "$GITHUB_ENV"
          ref="${{ inputs.ref || github.ref_name }}"
          case "$ref" in
            v*-tuna*) tag="$ref"; version="${ref#v}" ;;
            *) tag=""; version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)-tuna.g$(git rev-parse --short HEAD)" ;;
          esac
          case "${{ matrix.arch }}" in
            x86_64) bundle="$APP_ID-$version.flatpak" ;;
            *) bundle="$APP_ID-$version-${{ matrix.arch }}.flatpak" ;;
          esac
          # Manual runs that publish nothing get the fast profile, and the
          # x86_64 job of every manual run or release assembles the signed
          # repository; the daily build does neither.
          fast=false
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ -z "$tag" ] \
              && [ "${{ inputs.upstream_profile }}" != true ]; then
            fast=true
          fi
          repo=false
          if [ "${{ matrix.arch }}" = x86_64 ] \
              && { [ -n "$tag" ] || [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; }; then
            repo=true
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "bundle=$bundle"
            echo "fast=$fast"
            echo "repo=$repo"
          } >> "$GITHUB_OUTPUT"
          echo "building $APP_NAME $version for ${{ matrix.arch }}${tag:+, release $tag}$([ "$fast" = true ] && echo ', fast profile')"

      - name: Look up the SDK and extension commits
        id: refs
        run: |
          # The image ships the GNOME runtime and SDK in its system
          # installation; the extensions go into the user one, which is cached.
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sdk=$(flatpak info --show-commit org.gnome.Sdk//50)
          rust=$(flatpak remote-info --user --show-commit flathub "$RUST_EXTENSION")
          go=$(flatpak remote-info --user --show-commit flathub "$GO_EXTENSION")
          echo "org.gnome.Sdk//50 $sdk, $RUST_EXTENSION $rust, $GO_EXTENSION $go"
          state="flatpak-state-${{ matrix.arch }}-${sdk:0:12}-${rust:0:12}-"
          {
            echo "extensions=flatpak-extensions-${{ matrix.arch }}-${rust:0:12}-${go:0:12}"
            echo "state-prefix=$state"
            echo "state=$state$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Restore the SDK extensions
        id: extensions
        uses: actions/cache/restore@v4
        with:
          path: ~/.local/share/flatpak
          key: ${{ steps.refs.outputs.extensions }}

      - name: Install the Rust and Go SDK extensions
        if: steps.extensions.outputs.cache-hit != 'true'
        run: |
          install_ref() {
            # `--no-static-deltas` and the retries: Flathub's CDN occasionally
            # lists a delta it then 404s, as in build-arm64.yml.
            for attempt in 1 2 3; do
              if flatpak install --user -y --noninteractive --no-static-deltas flathub "$@"; then
                return 0
              fi
              echo "install attempt $attempt failed for $*; retrying"
              sleep 30
            done
            return 1
          }
          install_ref "$RUST_EXTENSION"
          # The Proton helper (native/proton-unofficial-sdk) is Go.
          install_ref "$GO_EXTENSION"

      - name: Cache the SDK extensions
        if: steps.extensions.outputs.cache-hit != 'true' && !startsWith(github.ref, 'refs/tags/')
        uses: actions/cache/save@v4
        with:
          path: ~/.local/share/flatpak
          key: ${{ steps.refs.outputs.extensions }}

      - name: Prepare the Tuta SDK
        # The helper (tuta-helper from tuta-unofficial-sdk) builds against an
        # SDK generated from the tutanota submodule plus the SDK's own
        # patches; the prepared tree is not tracked, so it is made here and
        # carried in with the checkout.
        run: sh native/tuta-unofficial-sdk/prepare.sh

      - name: Vendor the crate sources
        # As build-arm64.yml does: cargo-sources.json comes out of the app's
        # Cargo.lock, for the offline build inside the sandbox. The Tuta
        # helper's is committed in tuta-unofficial-sdk, whose CI keeps it
        # current.
        run: |
          curl -fsSL -o /tmp/gen-cargo-sources.py \
            https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py
          vendor() {
            for attempt in 1 2 3; do
              if python3 /tmp/gen-cargo-sources.py "$1/Cargo.lock" -o "$1/cargo-sources.json" 2>/tmp/gen.err; then
                break
              fi
              cat /tmp/gen.err
              module="$(sed -n "s/.*No module named '\([^']*\)'.*/\1/p" /tmp/gen.err | head -1)"
              if [ -z "$module" ]; then
                echo "generator failed for a reason other than a missing module" >&2
                exit 1
              fi
              echo "installing missing module: $module (attempt $attempt)"
              pip install --break-system-packages "$module"
            done
            test -s "$1/cargo-sources.json"
          }
          vendor .
          test -s native/tuta-unofficial-sdk/cargo-sources.json

      - name: Rebrand
        # This checkout is thrown away after the job, so it is rebranded in place.
        env:
          HYLKI_REBRAND_FAST_PROFILE: ${{ steps.version.outputs.fast == 'true' && '1' || '' }}
        run: HYLKI_REBRAND_IN_PLACE=1 fork/rebrand.sh "$PWD"

      - name: Restore the build cache
        id: state
        if: ${{ !inputs.clean }}
        uses: actions/cache/restore@v4
        with:
          # flatpak-builder's default state directory, which the generated
          # manifest's directory sources skip.
          path: .flatpak-builder
          # One entry per commit built; the newest one for the same SDK and
          # Rust toolchain is restored. A new toolchain starts from scratch
          # rather than carrying artifacts no build can use.
          key: ${{ steps.refs.outputs.state }}
          restore-keys: ${{ steps.refs.outputs.state-prefix }}

      - name: Keep unchanged sources' timestamps
        run: |
          # So cargo rebuilds only what changed since the cached build; the
          # Rust modules apply the directory times this writes.
          python3 fork/ci-mtimes.py record . .flatpak-builder/mtimes.json
          # flatpak-builder mounts this at /run/ccache when it exists; the
          # cargo target directories live under it, beside ccache's own
          # cache for the C compiled by build scripts.
          mkdir -p .flatpak-builder/ccache
          echo 'max_size = 500M' > .flatpak-builder/ccache/ccache.conf

      - name: Build
        run: |
          flatpak-builder --user --force-clean --disable-rofiles-fuse --ccache \
            --state-dir=.flatpak-builder \
            --repo="$RUNNER_TEMP/repo" --default-branch=stable \
            "$RUNNER_TEMP/build-dir" "fork/$APP_ID.yml"

      - name: Check the result
        run: |
          files="$RUNNER_TEMP/build-dir/files"
          case "${{ matrix.arch }}" in
            x86_64) want_arch='x86-64' ;;
            aarch64) want_arch='ARM aarch64' ;;
          esac
          for bin in hylki hylki-tuta hylki-proton; do
            file -L "$files/bin/$bin" | tee /dev/stderr | grep -q "$want_arch"
          done
          want="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          grep -q "version=\"$want\"" "$files/share/metainfo/$APP_ID.metainfo.xml" \
            || { echo "built app is not $want" >&2; exit 1; }
          grep -qx "Name=$APP_NAME" "$files/share/applications/$APP_ID.desktop"
          test -s "$files/share/icons/hicolor/scalable/apps/$APP_ID.svg"
          echo "hylki is $(stat -c %s "$files/bin/hylki") bytes ($([ "${{ steps.version.outputs.fast }}" = true ] && echo 'fast profile' || echo "upstream's profile"))"

      - name: Bundle
        run: |
          flatpak build-bundle --arch=${{ matrix.arch }} \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo \
            "$RUNNER_TEMP/repo" "${{ steps.version.outputs.bundle }}" "$APP_ID" stable
          sha256sum "${{ steps.version.outputs.bundle }}"

      - uses: actions/upload-artifact@v4
        with:
          name: fork-release-${{ matrix.arch }}
          path: ${{ steps.version.outputs.bundle }}
          retention-days: 30
          if-no-files-found: error

      - name: Trim the build cache
        if: steps.state.outputs.cache-hit != 'true' && !startsWith(github.ref, 'refs/tags/')
        run: |
          # Build directories are left behind only by a failed module, and
          # the hard-link farm is per build.
          rm -rf .flatpak-builder/build .flatpak-builder/rofiles
          targets=.flatpak-builder/ccache/cargo-target
          size=$(du -sm "$targets" 2>/dev/null | cut -f1)
          # The fast profile's target directory goes first: tags never use it.
          if [ "${size:-0}" -gt "$CARGO_TARGET_CAP_MB" ] && [ -d "$targets/hylki-fast" ]; then
            echo "cargo targets are ${size} MB, over ${CARGO_TARGET_CAP_MB} MB; not keeping the fast profile's"
            rm -rf "$targets/hylki-fast"
            size=$(du -sm "$targets" | cut -f1)
          fi
          if [ "${size:-0}" -gt "$CARGO_TARGET_CAP_MB" ]; then
            echo "cargo targets are ${size} MB, over ${CARGO_TARGET_CAP_MB} MB; not keeping them"
            rm -rf "$targets"
          fi
          du -sh .flatpak-builder/* .flatpak-builder/ccache/cargo-target/* 2>/dev/null || true

      - name: Save the build cache
        if: steps.state.outputs.cache-hit != 'true' && !startsWith(github.ref, 'refs/tags/')
        uses: actions/cache/save@v4
        with:
          path: .flatpak-builder
          key: ${{ steps.refs.outputs.state }}

      - name: Wait for the aarch64 bundle
        if: steps.version.outputs.repo == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # A separate release job would queue for a runner of its own, which
          # took over half an hour when the organisation's runners were busy.
          # If the aarch64 job ends without its bundle, nothing is published.
          run="repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID"
          has_bundle() {
            names=$(gh api "$run/artifacts?per_page=100" --jq '.artifacts[].name') || return 1
            grep -qx fork-release-aarch64 <<<"$names"
          }
          until has_bundle; do
            conclusion=$(gh api "$run/attempts/$GITHUB_RUN_ATTEMPT/jobs" \
              --jq '.jobs[] | select(.name == "aarch64") | .conclusion // ""') || conclusion=""
            if [ -n "$conclusion" ]; then
              has_bundle && break
              echo "the aarch64 job ended ($conclusion) without a bundle; not publishing" >&2
              exit 1
            fi
            sleep 20
          done

      - uses: actions/download-artifact@v4
        if: steps.version.outputs.repo == 'true'
        with:
          name: fork-release-aarch64

      - name: Sign into the Flatpak repository
        if: steps.version.outputs.repo == 'true'
        env:
          GH_REPO: ${{ github.repository }}
          GPG_PRIVATE_KEY: ${{ secrets.LIFAFA_GPG_PRIVATE_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
          # Where gh-pages is served, which the .flatpakrepo, .flatpakref and
          # bundles name.
          BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          export GPG_HOMEDIR="$RUNNER_TEMP/gnupg"
          install -d -m 700 "$GPG_HOMEDIR"
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --quiet --homedir "$GPG_HOMEDIR" --import
          # The published site, or an empty one before the first release, and
          # the release's bundles, under publish/ in the workspace (container
          # paths outside it do not reach upload-artifact as written).
          site="$PWD/publish/site"
          release="$PWD/publish/release"
          url="https://github.com/$GH_REPO.git"
          if git ls-remote --exit-code "$url" refs/heads/gh-pages >/dev/null; then
            git clone --quiet --depth 1 --branch gh-pages "$url" "$site"
            git -C "$site" rev-parse HEAD > publish/pages-head
          else
            git init --quiet -b gh-pages "$site"
            : > publish/pages-head
          fi
          # The aarch64 build reaches this job as its bundle.
          flatpak build-import-bundle --no-update-summary "$RUNNER_TEMP/repo" "$APP_ID-$VERSION-aarch64.flatpak"
          fork/flatpak-repo.sh "$site" "$RUNNER_TEMP/repo" "$VERSION" "$release"
          (cd "$release" && sha256sum ./*.flatpak | tee SHA256SUMS)
          test "$(wc -l < "$release/SHA256SUMS")" -eq 2
          gpgconf --homedir "$GPG_HOMEDIR" --kill gpg-agent || true
          rm -rf "$GPG_HOMEDIR"

      - name: Keep the unpublished repository
        # A manual run that is not a release stops here: the signed
        # repository and bundles are kept for inspection, and nothing is pushed.
        if: steps.version.outputs.repo == 'true' && steps.version.outputs.tag == ''
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-repo
          path: |
            publish/site
            publish/release
            !publish/site/.git
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

      - name: Publish the Flatpak repository
        if: steps.version.outputs.repo == 'true' && steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # One commit with no history: the branch holds the current
          # repository only, so objects pruned from it leave git as well.
          # The lease refuses to overwrite a publish that raced this one.
          cd publish/site
          git checkout --quiet --orphan published
          git add -A
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --quiet -m "$APP_NAME $VERSION"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push --quiet \
            --force-with-lease=refs/heads/gh-pages:"$(cat ../pages-head)" \
            "https://github.com/$GH_REPO.git" published:refs/heads/gh-pages

      - name: Attach the bundles
        if: steps.version.outputs.repo == 'true' && steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd publish/release
          pages="https://${GH_REPO%%/*}.github.io/${GH_REPO#*/}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "$APP_NAME $VERSION" \
              --notes "$APP_NAME $VERSION, the TunaOS office suite's email client: Hylki by hyprlab (https://github.com/hyprlab/hylki) with native Tuta and Proton Mail accounts, for x86_64 and aarch64. Install with \`flatpak install --user $pages/$APP_ID.flatpakref\` and \`flatpak update\` keeps it current; the bundles below install the same build and update from the same signed repository. It sits beside upstream Hylki and keeps its own data. Installed from a bundle of v1.47.1-tuna5 or earlier? See https://github.com/$GH_REPO/blob/main/fork/README.md#updates."
          fi
          gh release upload "$TAG" ./*.flatpak SHA256SUMS --clobber
